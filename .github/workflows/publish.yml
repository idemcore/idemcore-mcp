name: publish

# Publishes @idemcore/mcp to npm with trusted publishing (OIDC, no stored token).
# Configure on npm: Trusted Publisher → GitHub Actions, org "idemcore",
# repository "idemcore-mcp", workflow "publish.yml", environment "npm".
# Provenance is omitted while the repository is private (npm provenance needs a public source).

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - run: npm publish --access public
